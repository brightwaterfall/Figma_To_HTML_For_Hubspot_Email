{% set logo_href = module.logo_link.href|default('https://www.etreprof.fr/', true) %}
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td align="center" bgcolor="{{ module.background_color.color }}" style="background-color:{{ module.background_color.color }};padding:{{ module.padding_top }}px 16px {{ module.padding_bottom }}px 16px;text-align:center;">
      <a href="{{ logo_href|escape_url }}" target="_blank" style="display:inline-block;text-decoration:none;line-height:0;">
        {% if module.logo.src %}
        <img src="{{ module.logo.src|escape_url }}" width="{{ module.logo_width }}" alt="{{ module.logo.alt|escape_attr }}" border="0" style="display:block;width:{{ module.logo_width }}px;height:auto;border:0;outline:none;text-decoration:none;margin:0 auto;" />
        {% endif %}
      </a>
    </td>
  </tr>
</table>
