{% set cta_href = module.cta_link.href|default('https://www.etreprof.fr/', true) %}
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
  <tr>
    <td bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:0 16px {{ module.bottom_gap }}px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#F8F3FF;border-radius:21px 21px 21px 0;">
        <tr>
          <td valign="middle" style="padding:16px;font-family:'Merriweather',Georgia,serif;font-size:17px;line-height:22px;font-weight:300;color:#000000;">{{ module.text }}</td>
          {% if module.icon.src %}<td width="75" align="right" valign="middle" style="width:75px;padding:16px;"><img src="{{ module.icon.src|escape_url }}" width="43" alt="{{ module.icon.alt|escape_attr }}" style="display:block;width:43px;height:auto;border:0;" /></td>{% endif %}
        </tr>
      </table>
      {% if module.show_cta and module.cta_text %}
      <p style="margin:8px 0 0 0;font-family:'Assistant',Arial,sans-serif;font-size:13px;line-height:16px;font-weight:700;">
        <a href="{{ cta_href|escape_url }}" target="_blank" style="color:{{ module.cta_color.color }};text-decoration:underline;">{{ module.cta_text }}</a>
      </p>
      {% endif %}
    </td>
  </tr>
</table>
